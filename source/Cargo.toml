[package]
name = "noisekeeper"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }

[target.'cfg(windows)'.dependencies]
cpal = "0.15"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem",
  "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_Registry",
  "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Controls",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
